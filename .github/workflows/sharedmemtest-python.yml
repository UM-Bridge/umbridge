name: shared-mem-test-python

on:
  push:
  pull_request:
    branches:
      - 'main'

jobs:

  test:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    services:
      model:
        image: linusseelinger/model-exahype-tsunami:latest
        ports:
        - 4242:4242
        options: --ipc=host

    steps:
       -
        name: Checkout
        uses: actions/checkout@v2
       -
        name: Dependencies
        run: |
          apt update && DEBIAN_FRONTEND="noninteractive" apt install -y python3-pip python3-venv
       -
        name: Build and run
        run: |
          python3 -m venv venv
          . venv/bin/activate && pip3 install umbridge
          cd clients/python && python3 -u umbridge-client.py http://model:4242
