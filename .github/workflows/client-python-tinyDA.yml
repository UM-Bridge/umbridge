name: client-python-tinyDA

on:
  push:
  pull_request:
    branches:
      - 'main'

jobs:

  test:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    services:
      model:
        image: linusseelinger/model-muq-beam:latest
        ports:
        - 4242:4242

    steps:
       -
        name: Checkout
        uses: actions/checkout@v2
       -
        name: Dependencies
        run: |
          apt update && DEBIAN_FRONTEND="noninteractive" apt install -y python3-pip python3-venv cmake git gcc-11 g++-11
          python3 -m venv venv
          . venv/bin/activate
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export CC=gcc-11
          export CXX=g++-11
          pip3 install papermill umbridge tinyDA ipykernel ray "matplotlib<3.9"
       -
        name: Build and run
        run: |
          . venv/bin/activate
          papermill -k python3 --progress-bar clients/python/tinyDA-client.ipynb - > /dev/null
