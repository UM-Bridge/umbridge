name: client-python-tinyDA

on:
  push:
  pull_request:
    branches:
      - 'main'

jobs:

  test:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    services:
      model:
        image: linusseelinger/model-muq-beam:latest
        ports:
        - 4242:4242

    steps:
       -
        name: Checkout
        uses: actions/checkout@v2
       -
        name: Dependencies
        run: |
          # Pinned to Python 3.12: tinyDA pins arviz<0.19, whose use of the
          # matplotlib.style.core internal API only works with old matplotlib
          # versions
          apt update && DEBIAN_FRONTEND="noninteractive" apt install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt update && DEBIAN_FRONTEND="noninteractive" apt install -y python3.12 python3.12-venv
          python3.12 -m venv venv
          . venv/bin/activate
          pip3 install papermill umbridge tinyDA ipykernel ray "matplotlib<3.9"
       -
        name: Build and run
        run: |
          . venv/bin/activate
          papermill -k python3 --progress-bar clients/python/tinyDA-client.ipynb - > /dev/null
